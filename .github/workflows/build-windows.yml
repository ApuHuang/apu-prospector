# 用 GitHub 的雲端 Windows 打包 APU Prospector 的 Windows 版（單一 exe），打包好會附到那個 Release。
# 發布 Release 時自動執行；也可以在 Actions 頁面手動執行。
name: 打包 Windows 版

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附上 Windows 版的 Release 標籤（例如 v0.1.0）；留空就只存成這次執行的成品"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"  # 輸出即時出現在記錄裡
      PYTHONUTF8: "1"        # 中文訊息用 UTF-8，不受雲端機的系統語系影響
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安裝
        run: python -m pip install pyinstaller pillow pywebview

      - name: 測試（原始碼）
        run: python serve.py --smoke-test smoke.txt && cat smoke.txt

      - name: 打包並自動測試打包好的程式
        timeout-minutes: 15
        run: python packaging/build_exe.py

      - uses: actions/upload-artifact@v7
        with:
          name: APUProspector-windows
          path: dist/APUProspector-*-win64.exe

      - name: 附到 Release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/APUProspector-*-win64.exe --clobber
